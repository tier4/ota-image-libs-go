name: test CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yaml'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
  # allow the test CI to be manually triggerred
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test:
    name: Run go test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Go test
        run: |
          # prepare the ota_image_6g_blob.zip
          zstd -d ./artifact/testdata/ota_image_6g_blob.zip.zst -o ./artifact/testdata/ota_image_6g_blob.zip
          mkdir -p ./.test
          go test -coverprofile ./.test/coverage.out -json -v ./artifact 2>&1 | tee ./.test/report.json

      - name: Upload test results
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        # best-effort: a missing or invalid SONAR_TOKEN must not fail CI
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
